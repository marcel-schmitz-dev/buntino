<main class="home">
  <header class="topbar">
    <button class="icon-button" aria-label="Ton einschalten oder ausschalten">🔊</button>

    <div class="brand">
      <h1>Buntino<span>★</span></h1>
      <p>Entdecken · Lernen · Wachsen</p>
    </div>

    <button class="icon-button" aria-label="Einstellungen">⚙️</button>
  </header>

  <section class="welcome">
    <h2>Hallo, kleine Entdecker!</h2>
    <p>Wähle deinen Modus und starte dein buntes Lernabenteuer!</p>
  </section>

  <section class="mode-grid" aria-label="Spielmodus wählen">
    <article class="mode-card discover">
      <div class="mascot" aria-hidden="true">🦁</div>
      <h3>Entdecker</h3>
      <p>Für die Kleinsten</p>
      <button (click)="selectMode.emit('discover')">Los geht's! →</button>
    </article>

    <article class="mode-card research">
      <div class="mascot" aria-hidden="true">🦊</div>
      <h3>Forscher</h3>
      <p>Für neugierige Köpfe</p>
      <button (click)="selectMode.emit('research')">Los geht's! →</button>
    </article>
  </section>

  <section class="worlds">
    <h2>Unsere Lernwelten</h2>

    <div class="world-grid">
      @for (world of worlds; track world.name) {
        <button class="world-card" [class]="world.color" (click)="selectMode.emit('discover')">
          <span class="world-emoji">{{ world.emoji }}</span>
          <span>{{ world.name }}</span>
        </button>
      }
    </div>
  </section>

  <footer>Gemeinsam die Welt entdecken! 💗</footer>
</main>
