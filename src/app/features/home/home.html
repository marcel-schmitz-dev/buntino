<main class="home">
  <img src="assets/wiese.webp" alt="Wiese Hintergrund" class="bg-wiese" />

  <header class="topbar">
    <button class="icon-button" aria-label="Ton einschalten oder ausschalten">
      <span class="btn-icon">🔊</span>
    </button>

    <div class="brand">
      <div class="logo-container">
        <svg viewBox="0 0 540 180" class="curved-logo-svg">
          <path id="curve-title" d="M 45,140 Q 270,20 495,140" fill="transparent" />
          <path id="curve-subtitle" d="M 75,160 Q 270,75 465,160" fill="transparent" />

          <text class="svg-buntino-text">
            <textPath href="#curve-title" startOffset="48%" text-anchor="middle">
              <tspan class="l-b">B</tspan>
              <tspan class="l-u">u</tspan>
              <tspan class="l-n">n</tspan>
              <tspan class="l-t">t</tspan>
              <tspan class="l-i">i</tspan>
              <tspan class="l-n2">n</tspan>
            </textPath>
          </text>

          <text class="svg-subtitle-text">
            <textPath href="#curve-subtitle" startOffset="50%" text-anchor="middle">
              Entdecken · Lernen · Wachsen
            </textPath>
          </text>
        </svg>

        <!-- Das O mit dem Stern direkt am Ende des Buntin-Schriftzugs -->
        <div class="logo-star-o" aria-hidden="true">★</div>
      </div>
    </div>

    <button class="icon-button" aria-label="Einstellungen">
      <span class="btn-icon">⚙️</span>
    </button>
  </header>

  <section class="welcome">
    <h2>Hallo, kleine Entdecker!</h2>
    <p>Wähle, wie alt du bist und starte dein buntes Lernabenteuer!</p>
  </section>

  <section class="mode-grid" aria-label="Spielmodus wählen">
    <article class="mode-card discover">
      <img src="assets/tiger.webp" alt="Tiger" class="card-bg-img" />
      <div class="card-content">
        <div class="card-header">
          <h3>Entdecker</h3>
          <span class="age-tag">2 Jahre</span>
        </div>

        <button class="btn-discover" (click)="selectMode.emit('discover')">Los geht's! →</button>
      </div>
    </article>

    <article class="mode-card research">
      <img src="assets/fuchs.webp" alt="Fuchs" class="card-bg-img" />
      <div class="card-content">
        <div class="card-header">
          <h3>Forscher</h3>
          <span class="age-tag">8 Jahre</span>
        </div>

        <button class="btn-research" (click)="selectMode.emit('research')">Los geht's! →</button>
      </div>
    </article>
  </section>

  <section class="worlds">
    <h2><span class="sub-arrow">➔</span> Unsere Lernwelten <span class="sub-arrow">➔</span></h2>

    <div class="world-grid">
      @for (world of worlds; track world.id) {
        <button
          class="world-card"
          (click)="selectCategory.emit(world.id)"
          [attr.aria-label]="'Lernwelt ' + world.name + ' öffnen'"
        >
          <img [src]="world.image" [alt]="world.name" class="world-card-bg-img" />

          <div class="world-card-content">
            <span class="world-title-badge">{{ world.name }}</span>
          </div>
        </button>
      }
    </div>
  </section>

  <footer class="footer">Gemeinsam die Welt entdecken! 💗</footer>
</main>
